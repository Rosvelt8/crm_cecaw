<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors connexion | Cecaw Finance S.A</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #fdf9e7; color: #1c1917; }
    main { max-width: 26rem; margin: 1.5rem; padding: 2rem; text-align: center; background: #fff; border: 1px solid #f0d475; border-radius: 1rem; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
    img { width: 84px; height: 84px; }
    h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
    p { color: #57534e; line-height: 1.5; margin: .5rem 0; font-size: .95rem; }
    button { margin-top: 1.25rem; padding: .65rem 1.4rem; font-size: .95rem; font-weight: 600; color: #fff; background: #b8860b; border: 0; border-radius: .6rem; cursor: pointer; }
    button:hover { background: #96670a; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="CECAW">
    <h1>Vous êtes hors connexion</h1>

    <p>Vérifiez votre réseau, puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
